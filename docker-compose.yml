version: '3.8'

services:
  db:
    image: postgres:15
    container_name: speedometer_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: speedometer
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: speedometer_backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/speedometer
    ports:
      - "8765:8765"
    restart: always

  frontend:
    build: .
    container_name: speedometer_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
